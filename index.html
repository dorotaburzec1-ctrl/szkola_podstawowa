<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ułamki dziesiętne — zeszyt Marysi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eaf1fb;
    --paper: #ffffff;
    --grid-line: rgba(29,78,216,0.09);
    --margin-line: rgba(214,69,69,0.32);
    --ink: #1f2a37;
    --muted: #5b6b80;
    --blue: #1d4ed8;
    --blue-soft: #e4ecfd;
    --red: #d64545;
    --red-soft: #fbe6e6;
    --green: #2f9e44;
    --green-soft: #e5f6e8;
    --amber: #b45309;
    --amber-soft: #fef1dc;
    --star: #ec9a10;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(31,42,55,0.06), 0 6px 18px rgba(31,42,55,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141d;
      --paper: #1b2333;
      --grid-line: rgba(147,197,253,0.09);
      --margin-line: rgba(248,113,113,0.22);
      --ink: #e7edf6;
      --muted: #9aa8bc;
      --blue: #7aa2f7;
      --blue-soft: #24304a;
      --red: #f28b82;
      --red-soft: #3a2323;
      --green: #7fd99a;
      --green-soft: #1f3327;
      --amber: #f0b429;
      --amber-soft: #3a2f14;
      --star: #ffce54;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141d;
    --paper: #1b2333;
    --grid-line: rgba(147,197,253,0.09);
    --margin-line: rgba(248,113,113,0.22);
    --ink: #e7edf6;
    --muted: #9aa8bc;
    --blue: #7aa2f7;
    --blue-soft: #24304a;
    --red: #f28b82;
    --red-soft: #3a2323;
    --green: #7fd99a;
    --green-soft: #1f3327;
    --amber: #f0b429;
    --amber-soft: #3a2f14;
    --star: #ffce54;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    line-height: 1.55;
    padding: 22px 14px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header.hero {
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 26px 22px;
    position: relative;
    overflow: hidden;
    border-left: 4px solid var(--margin-line);
  }
  header.hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(var(--grid-line) 0 1px, transparent 1px 28px),
                       repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 28px);
    opacity: 0.6;
    pointer-events: none;
  }
  header.hero h1 {
    font-family: 'Caveat', cursive;
    font-size: 2.6rem;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--blue);
    position: relative;
  }
  header.hero p.sub {
    margin: 0;
    color: var(--muted);
    font-size: 1.02rem;
    position: relative;
    max-width: 46ch;
  }
  .overall-stars {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    position: relative;
  }
  .chip {
    background: var(--blue-soft);
    color: var(--blue);
    border-radius: 999px;
    padding: 6px 13px;
    font-weight: 700;
    font-size: 0.86rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  nav.tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 18px 0;
  }
  nav.tabs button {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    padding: 12px 6px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: var(--paper);
    color: var(--muted);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.12s ease, color 0.15s ease, border-color 0.15s ease;
  }
  nav.tabs button .stars { display:block; font-size: 0.72rem; margin-top: 3px; color: var(--star); letter-spacing: 1px;}
  nav.tabs button:hover { transform: translateY(-1px); }
  nav.tabs button.active { color: var(--blue); border-color: var(--blue); }
  nav.tabs button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  section.op { display: none; }
  section.op.active { display: block; animation: fadein 0.25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity:1; transform:none; } }

  .card {
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 22px 24px;
    margin-bottom: 18px;
    position: relative;
  }
  .card.teoria { border-left: 4px solid var(--blue); transition: box-shadow 0.4s ease; }
  .card.teoria.pulse { animation: pulseBox 1.1s ease 2; }
  @keyframes pulseBox {
    0%,100% { box-shadow: var(--shadow); }
    50% { box-shadow: 0 0 0 4px var(--blue-soft), var(--shadow); }
  }
  .card h2 {
    font-family: 'Caveat', cursive;
    font-size: 1.9rem;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .card h3 {
    font-size: 1rem;
    text-transform: none;
    color: var(--muted);
    margin: 18px 0 8px;
    font-weight: 800;
  }
  .rule-box {
    background: var(--blue-soft);
    color: var(--ink);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.98rem;
  }
  .rule-box b { color: var(--blue); }

  .example {
    margin-top: 14px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .colgrid {
    display: inline-grid;
    grid-auto-rows: auto;
    font-variant-numeric: tabular-nums;
    font-size: 1.25rem;
    font-weight: 700;
    background: repeating-linear-gradient(var(--grid-line) 0 1px, transparent 1px 34px),
                repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 30px);
    padding: 6px 10px;
    border-radius: 8px;
  }
  .colgrid .row { display: contents; }
  .colgrid .cell { width: 30px; height: 34px; display:flex; align-items:center; justify-content:center; }
  .colgrid .comma { color: var(--red); }
  .colgrid .op-sign { color: var(--muted); font-size: 1rem; }
  .colgrid .line-row { border-top: 2px solid var(--ink); margin-top: 2px; grid-column: 1 / -1; }
  .colgrid .result .cell { color: var(--green); }

  .steps-flow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .steps-flow .box {
    background: var(--blue-soft);
    padding: 8px 12px;
    border-radius: 8px;
  }
  .steps-flow .arrow { color: var(--muted); font-weight: 400; }
  .steps-flow .final { background: var(--green-soft); color: var(--green); }

  .audio-btn {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--paper);
    border: 2px solid var(--blue);
    color: var(--blue);
    font-weight: 800;
    font-family: 'Nunito', sans-serif;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.92rem;
  }
  .audio-btn:hover { background: var(--blue-soft); }
  .audio-btn.speaking { background: var(--blue); color: var(--paper); }

  /* quiz */
  .quiz-progress {
    font-size: 0.86rem;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .quiz-q { font-size: 1.15rem; font-weight: 800; margin-bottom: 12px; }
  .quiz-options { display: grid; gap: 9px; }
  .quiz-options button {
    text-align: left;
    padding: 12px 14px;
    border-radius: 10px;
    border: 2px solid var(--grid-line);
    background: var(--paper);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .quiz-options button:hover:not(:disabled) { border-color: var(--blue); }
  .quiz-options button.correct { border-color: var(--green); background: var(--green-soft); color: var(--green); }
  .quiz-options button.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }
  .quiz-options button:disabled { cursor: default; opacity: 0.85; }
  .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-weight: 700; display:none; }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--green-soft); color: var(--green); }
  .feedback.bad { background: var(--red-soft); color: var(--red); }
  .feedback .expl { display:block; font-weight: 500; margin-top: 6px; color: var(--ink); }
  .back-link {
    margin-top: 10px;
    display: inline-block;
    background: none;
    border: none;
    color: var(--blue);
    font-weight: 800;
    text-decoration: underline;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    padding: 0;
  }
  .next-btn {
    margin-top: 14px;
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 800;
    cursor: pointer;
    display: none;
  }
  .next-btn.show { display: inline-block; }
  .quiz-done { display:none; text-align:center; padding: 10px 0; }
  .quiz-done.show { display:block; }
  .quiz-done .big { font-size: 2rem; }
  .retry-btn {
    margin-top: 10px;
    background: var(--blue-soft);
    color: var(--blue);
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 800;
    cursor: pointer;
  }

  /* zadania */
  .task { padding: 14px 0; border-top: 1px solid var(--grid-line); }
  .task:first-of-type { border-top: none; padding-top: 0; }
  .task-q { font-weight: 800; font-size: 1.06rem; margin-bottom: 10px; }
  .task-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .task-row input {
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 8px;
    border: 2px solid var(--grid-line);
    width: 130px;
    background: var(--paper);
    color: var(--ink);
  }
  .task-row input:focus { outline: none; border-color: var(--blue); }
  .task-row button {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }
  .task-result { margin-top: 8px; font-weight: 700; display:none; }
  .task-result.show { display:block; }
  .task-result.ok { color: var(--green); }
  .task-result.bad { color: var(--red); }
  .task.solved .task-q { color: var(--green); }
  .task.solved .task-row input { border-color: var(--green); }

  /* --- stepper (krok po kroku) --- */
  .stepper-panel {
    margin-top: 6px;
    border: 2px dashed var(--blue);
    border-radius: 12px;
    padding: 18px 16px 16px;
  }
  .stepper-stage {
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 0 14px;
  }
  .stepper-caption {
    text-align: center;
    font-weight: 700;
    font-size: 0.96rem;
    min-height: 44px;
    margin-bottom: 10px;
    color: var(--ink);
  }
  .stepper-controls { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .stepper-controls button {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 8px 15px;
    border-radius: 999px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
  }
  .stepper-controls button:disabled { opacity: 0.3; cursor: default; }
  .stepper-dots { display: flex; gap: 6px; }
  .stepper-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--grid-line); display:inline-block; }
  .stepper-dots span.active { background: var(--blue); }

  /* borrow (pożyczanie) grid */
  .borrow-grid2 {
    display: inline-grid;
    grid-template-columns: 24px 46px 16px 46px 46px;
    row-gap: 2px;
  }
  .bcell { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-height: 42px; }
  .bcell.head { min-height: 20px; font-size: 0.62rem; color: var(--muted); font-weight: 800; justify-content: flex-end; }
  .bcell .val { font-size: 1.45rem; line-height: 1.15; font-weight: 800; color: var(--ink); }
  .bcell .val.old { font-size: 0.8rem; text-decoration: line-through; color: var(--muted); font-weight: 700; line-height: 1; }
  .bcell .val.new { color: var(--red); }
  .bcell .val.result { color: var(--green); }
  .bcell .val.empty { color: var(--grid-line); }
  .bcell.active .val:last-child { background: var(--blue-soft); border-radius: 6px; padding: 0 5px; }
  .borrow-grid2 .divider { grid-column: 1 / -1; border-top: 2px solid var(--ink); margin: 3px 0 4px; }

  /* multiplication comma demo */
  .eq-display { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 1.4rem; font-weight: 800; }
  .eq-display .op { font-size: 1.2rem; color: var(--muted); font-weight: 700; }
  .eq-display .num-block { display: flex; flex-direction: column; align-items: center; }
  .eq-display .num-block .hl { color: var(--red); }
  .eq-display .num-block .tag { font-size: 0.62rem; color: var(--muted); font-weight: 700; margin-top: 3px; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; font-weight: 800; }
  .frac .line { width: 100%; border-top: 2px solid var(--ink); margin: 2px 0; }
  .eq-display .final { color: var(--green); }

  /* częsty błąd */
  .mistake-box {
    margin-top: 16px;
    background: var(--amber-soft);
    border-left: 4px solid var(--amber);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .mistake-box h4 { margin: 0 0 8px; font-size: 0.98rem; color: var(--amber); font-weight: 800; }
  .mistake-box p { margin: 8px 0 0; font-size: 0.92rem; }
  .compare-row { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .compare-box {
    flex: 1 1 140px;
    border-radius: 8px;
    padding: 10px 12px;
    text-align: center;
    font-weight: 800;
    font-size: 1.15rem;
  }
  .compare-box.wrong { border: 2px solid var(--red); color: var(--red); background: var(--red-soft); }
  .compare-box.right { border: 2px solid var(--green); color: var(--green); background: var(--green-soft); }
  .compare-box .tag { display: block; font-size: 0.68rem; font-weight: 800; margin-bottom: 4px; }
  .compare-box .zero-hl { text-decoration: underline; text-decoration-thickness: 2px; }

  /* wielu składników */
  .multi-note { font-size: 0.92rem; color: var(--muted); margin: 6px 0 0; }

  /* pobieranie kart pracy (email gate) */
  .download-card { border-left: 4px solid var(--green); }
  .download-card p.lead { color: var(--muted); font-size: 0.94rem; margin: 0 0 14px; }
  .email-gate-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .email-gate-form input[type="email"] {
    flex: 1 1 200px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.98rem;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 8px;
    border: 2px solid var(--grid-line);
    background: var(--paper);
    color: var(--ink);
  }
  .email-gate-form input[type="email"]:focus { outline: none; border-color: var(--green); }
  .email-gate-form button {
    background: var(--green);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }
  .email-gate-note { font-size: 0.76rem; color: var(--muted); margin-top: 8px; }
  .download-ready { display: none; text-align: center; padding: 6px 0; }
  .download-ready.show { display: block; }
  .download-ready a.dl-link {
    display: inline-block;
    background: var(--green);
    color: #fff;
    text-decoration: none;
    font-weight: 800;
    padding: 11px 22px;
    border-radius: 999px;
    margin-top: 6px;
  }
  .download-ready .thanks { font-weight: 700; color: var(--green); margin-bottom: 4px; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 24px;
  }
  footer button {
    background: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }

  @media (max-width: 480px) {
    header.hero h1 { font-size: 2.1rem; }
    .colgrid { font-size: 1.05rem; }
    nav.tabs { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<!-- Statyczny formularz, żeby Netlify wykrył go podczas budowania strony. Prawdziwe formularze renderuje JS niżej i wysyła pod tę samą nazwę. -->
<form name="karty-pracy" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field">
  <input type="email" name="email">
  <input type="text" name="sekcja">
</form>
<div class="wrap">

  <header class="hero">
    <h1>Ułamki dziesiętne ✏️</h1>
    <p class="sub">Dodawanie, odejmowanie, mnożenie i dzielenie — teoria, quizy i zadania dla Marysi.</p>
    <div class="overall-stars" id="overallStars"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div id="sections"></div>

  <footer>
    Powodzenia, Marysiu! Jeśli coś się nie uda za pierwszym razem — to normalne, wracaj do teorii i spróbuj jeszcze raz.
    <br>
    <button id="resetBtn" type="button">Wyczyść postępy</button>
  </footer>
</div>

<script>
(function(){

  // ---------- POMOCNICZE DO WIZUALIZACJI "POŻYCZANIA" ----------
  function bc(main, opts){
    opts = opts || {};
    var cls = "val " + (opts.cls || "plain");
    var oldHtml = opts.old ? ('<span class="val old">' + opts.old + '</span>') : "";
    return '<div class="bcell' + (opts.active ? ' active' : '') + '">' + oldHtml + '<span class="' + cls + '">' + main + '</span></div>';
  }
  function brow(signTxt, jHtml, dHtml, sHtml){
    var signCell = '<div class="bcell"><span class="val plain">' + (signTxt || "") + '</span></div>';
    var commaCell = '<div class="bcell"><span class="val plain">,</span></div>';
    return signCell + jHtml + commaCell + dHtml + sHtml;
  }
  var BORROW_HEAD =
    '<div class="bcell head">&nbsp;</div><div class="bcell head">jedn.</div>' +
    '<div class="bcell head">&nbsp;</div><div class="bcell head">dzies.</div><div class="bcell head">setne</div>';
  function borrowStage(rows){
    return '<div class="borrow-grid2">' + BORROW_HEAD + rows + '</div>';
  }

  var BORROW_DEMO = [
    {
      html: borrowStage(
        brow("", bc("7"), bc("2"), bc("0", {active:true})) +
        brow("−", bc("3"), bc("4"), bc("5", {active:true})) +
        '<div class="divider"></div>' +
        brow("", bc("–", {cls:"empty"}), bc("–", {cls:"empty"}), bc("–", {cls:"empty"}))
      ),
      caption: "Zaczynamy od ostatniej kolumny — setnych: 0 − 5. Nie da się, bo 0 jest mniejsze niż 5. Trzeba pożyczyć z sąsiedniej kolumny (dziesiątych)."
    },
    {
      html: borrowStage(
        brow("", bc("7"), bc("1", {old:"2", active:true, cls:"new"}), bc("10", {old:"0", active:true, cls:"new"})) +
        brow("−", bc("3"), bc("4"), bc("5")) +
        '<div class="divider"></div>' +
        brow("", bc("–", {cls:"empty"}), bc("–", {cls:"empty"}), bc("–", {cls:"empty"}))
      ),
      caption: "Pożyczamy 1 z dziesiątych: 2 zamienia się w 1, a setne dostają dodatkową „dziesiątkę” — zamiast 0 mamy teraz 10."
    },
    {
      html: borrowStage(
        brow("", bc("7"), bc("1"), bc("10", {active:true})) +
        brow("−", bc("3"), bc("4"), bc("5", {active:true})) +
        '<div class="divider"></div>' +
        brow("", bc("–", {cls:"empty"}), bc("–", {cls:"empty"}), bc("5", {cls:"result", active:true}))
      ),
      caption: "Teraz można odjąć: 10 − 5 = 5. To są nasze setne w wyniku."
    },
    {
      html: borrowStage(
        brow("", bc("7"), bc("1", {active:true}), bc("10")) +
        brow("−", bc("3"), bc("4", {active:true}), bc("5")) +
        '<div class="divider"></div>' +
        brow("", bc("–", {cls:"empty"}), bc("–", {cls:"empty"}), bc("5", {cls:"result"}))
      ),

  var STORAGE_KEY = "ulamki-marysia-progress-v1";
  var state = {};
  SECTIONS.forEach(function(s){
    state[s.id] = { quizIndex: 0, quizCorrect: 0, quizDone: false, tasksSolved: {} };
  });

  function loadProgress(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var saved = JSON.parse(raw);
        SECTIONS.forEach(function(s){
          if (saved[s.id]) state[s.id] = saved[s.id];
        });
      }
    } catch(e) { /* brak dostępu do pamięci — pracujemy tylko w tej sesji */ }
  }
  function saveProgress(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }
  loadProgress();

  // ---------- BUDOWA NAWIGACJI ----------
  var tabsEl = document.getElementById("tabs");
  var sectionsEl = document.getElementById("sections");
  var activeId = SECTIONS[0].id;

  function starsFor(sectionId){
    var s = state[sectionId];
    var sec = SECTIONS.filter(function(x){return x.id===sectionId;})[0];
    var quizStars = sec.quiz.length ? Math.round((s.quizCorrect / sec.quiz.length) * 2) : 0;
    var tasksSolvedCount = Object.keys(s.tasksSolved).filter(function(k){return s.tasksSolved[k];}).length;
    var taskStars = sec.tasks.length ? Math.round((tasksSolvedCount / sec.tasks.length) * 1) : 0;
    var total = Math.min(3, quizStars + taskStars);
    return total;
  }

  function starString(n){
    var out = "";
    for (var i=0;i<3;i++) out += (i < n ? "★" : "☆");
    return out;
  }

  function renderTabs(){
    tabsEl.innerHTML = "";
    SECTIONS.forEach(function(s){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab-btn" + (s.id === activeId ? " active" : "");
      btn.innerHTML = s.icon + " " + s.label + "<span class='stars'>" + starString(starsFor(s.id)) + "</span>";
      btn.addEventListener("click", function(){
        activeId = s.id;
        renderTabs();
        renderSections();
        window.scrollTo({top: 0, behavior:"smooth"});
      });
      tabsEl.appendChild(btn);
    });
  }

  function renderOverallStars(){
    var el = document.getElementById("overallStars");
    var totalStars = 0;
    SECTIONS.forEach(function(s){ totalStars += starsFor(s.id); });
    el.innerHTML = '<span class="chip">🌟 ' + totalStars + ' / ' + (SECTIONS.length*3) + ' gwiazdek</span>';
  }

  function buildColgrid(example){
    var cols = example.headers.length;
    var html = '<div class="colgrid" style="grid-template-columns: repeat(' + cols + ', 30px);">';
    example.rows.forEach(function(row){
      row.forEach(function(cell, i){
        var cls = "cell" + (cell === "," ? " comma" : "");
        html += '<div class="' + cls + '">' + cell + '</div>';
      });
    });
    html += '<div class="line-row"></div>';
    example.result.forEach(function(cell){
      var cls = "cell result" + (cell === "," ? " comma" : "");
      html += '<div class="' + cls + '"><span class="cell">' + cell + '</span></div>';
    });
    html += '</div>';
    return html;
  }

  function buildSteps(steps){
    var html = '<div class="steps-flow">';
    steps.forEach(function(st, i){
      html += '<span class="box' + (st.final ? ' final' : '') + '">' + st.boxes[0] + '</span>';
      if (st.arrow) html += '<span class="arrow">→ ' + st.arrow + ' →</span>';
      else if (i < steps.length - 1) html += '<span class="arrow">→</span>';
    });
    html += '</div>';
    return html;
  }

  // ---------- MOWA (audio) ----------
  var currentUtterance = null;
  function speak(text, btn){
    if (!('speechSynthesis' in window)) {
      btn.textContent = "🔇 Ta przeglądarka nie obsługuje czytania na głos";
      return;
    }
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      btn.classList.remove("speaking");
      btn.textContent = "🔊 Przeczytaj teorię na głos";
      return;
    }
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "pl-PL";
      u.rate = 0.95;
      var voices = window.speechSynthesis.getVoices();
      var plVoice = voices.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf("pl") === 0; })[0];
      if (plVoice) u.voice = plVoice;
      u.onstart = function(){ btn.classList.add("speaking"); btn.textContent = "⏸️ Czytam... (kliknij, by zatrzymać)"; };
      u.onend = function(){ btn.classList.remove("speaking"); btn.textContent = "🔊 Przeczytaj teorię na głos"; };
      u.onerror = function(){ btn.classList.remove("speaking"); btn.textContent = "🔊 Przeczytaj teorię na głos"; };
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch(e) {
      btn.textContent = "🔇 Nie udało się uruchomić czytania";
    }
  }

  // ---------- STEPPER (kroki wyjaśnień) ----------
  function createStepper(containerId, frames){
    var idx = 0;
    var root = document.getElementById(containerId);
    if (!root) return;
    function render(){
      var f = frames[idx];
      var dots = frames.map(function(_, i){ return '<span class="' + (i === idx ? 'active' : '') + '"></span>'; }).join('');
      root.innerHTML =
        '<div class="stepper-stage">' + f.html + '</div>' +
        '<div class="stepper-caption">' + f.caption + '</div>' +
        '<div class="stepper-controls">' +
          '<button type="button" id="' + containerId + '-prev"' + (idx === 0 ? ' disabled' : '') + '>← Wstecz</button>' +
          '<div class="stepper-dots">' + dots + '</div>' +
          '<button type="button" id="' + containerId + '-next"' + (idx === frames.length - 1 ? ' disabled' : '') + '>Dalej →</button>' +
        '</div>';
      document.getElementById(containerId + "-prev").addEventListener("click", function(){ if (idx > 0) { idx--; render(); } });
      document.getElementById(containerId + "-next").addEventListener("click", function(){ if (idx < frames.length - 1) { idx++; render(); } });
    }
    render();
  }

  // ---------- POBIERANIE KART PRACY (Netlify Forms + e-mail) ----------
  var PDF_STORAGE_KEY = "ulamki-marysia-pdf-unlocked-v1";
  var unlockedPdfs = {};
  try {
    var rawPdf = localStorage.getItem(PDF_STORAGE_KEY);
    if (rawPdf) unlockedPdfs = JSON.parse(rawPdf);
  } catch(e) {}
  function saveUnlocked(){ try { localStorage.setItem(PDF_STORAGE_KEY, JSON.stringify(unlockedPdfs)); } catch(e) {} }

  function renderDownloadGate(sec){
    var formHost = document.getElementById("dlform-" + sec.id);
    var readyBox = document.getElementById("dlready-" + sec.id);
    if (!formHost || !readyBox) return;
    if (unlockedPdfs[sec.id]) {
      formHost.style.display = "none";
      readyBox.classList.add("show");
      return;
    }
    formHost.innerHTML =
      '<form class="email-gate-form" id="realform-' + sec.id + '">' +
        '<input type="email" required placeholder="twój e-mail" id="emailinput-' + sec.id + '">' +
        '<button type="submit">Odblokuj i pobierz</button>' +
      '</form>' +
      '<div class="email-gate-note">Podaj e-mail, żeby odblokować PDF do druku — dzięki temu będziemy mogli przesyłać nowe materiały. Formularz obsługiwany przez Netlify Forms.</div>';
    var formEl = document.getElementById("realform-" + sec.id);
    formEl.addEventListener("submit", function(e){
      e.preventDefault();
      var emailVal = document.getElementById("emailinput-" + sec.id).value;
      var body = "form-name=karty-pracy&bot-field=&email=" + encodeURIComponent(emailVal) + "&sekcja=" + encodeURIComponent(sec.id);
      fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
      }).then(unlock).catch(unlock);
      function unlock(){
        unlockedPdfs[sec.id] = true;
        saveUnlocked();
        formHost.style.display = "none";
        readyBox.classList.add("show");
      }
    });
  }

  // ---------- RENDER SEKCJI ----------
  function renderSections(){
    sectionsEl.innerHTML = "";
    var sec = SECTIONS.filter(function(s){ return s.id === activeId; })[0];
    var wrapper = document.createElement("section");
    wrapper.className = "op active";

    var teoriaHtml =
      '<div class="card teoria" id="teoria-' + sec.id + '">' +
        '<h2>' + sec.icon + ' ' + sec.label + ' ułamków dziesiętnych — teoria</h2>' +
        '<div class="rule-box">' + sec.rule + '</div>' +
        '<h3>Przykład krok po kroku</h3>' +
        '<div class="example">' +
          (sec.example ? buildColgrid(sec.example) : '') +
          (sec.steps ? buildSteps(sec.steps) : '') +
        '</div>' +
        (sec.example2 ? ('<h3>' + sec.example2Label + '</h3><p class="multi-note">' + sec.example2Note + '</p><div class="example">' + buildColgrid(sec.example2) + '</div>') : '') +
        (sec.mistakeBox || '') +
        (sec.borrowDemo ? ('<h3>🔍 Jak działa pożyczanie? (krok po kroku)</h3><div class="stepper-panel" id="stepper-' + sec.id + '"></div>') : '') +
        (sec.commaDemo ? ('<h3>🔍 Skąd się biorą te cyfry po przecinku?</h3><div class="stepper-panel" id="stepper-' + sec.id + '"></div>') : '') +
        '<button type="button" class="audio-btn" id="audio-' + sec.id + '">🔊 Przeczytaj teorię na głos</button>' +
      '</div>';

    var quizHtml =
      '<div class="card quiz-card" id="quiz-' + sec.id + '">' +
        '<h2>Mini-quiz</h2>' +
        '<div id="quiz-body-' + sec.id + '"></div>' +
      '</div>';

    var tasksHtml =
      '<div class="card tasks-card">' +
        '<h2>Zadania do samodzielnego rozwiązania</h2>' +
        '<div id="tasks-body-' + sec.id + '"></div>' +
      '</div>';

    var downloadHtml =
      '<div class="card download-card">' +
        '<h2>📥 Karty pracy do druku — ' + sec.label.toLowerCase() + '</h2>' +
        '<p class="lead">Dodatkowy pakiet: ' + (sec.pdfPages || 10) + ' stron zadań do wydrukowania + klucz odpowiedzi dla sprawdzającego.</p>' +
        '<div id="dlform-' + sec.id + '"></div>' +
        '<div class="download-ready" id="dlready-' + sec.id + '">' +
          '<div class="thanks">Dziękujemy! 🎉</div>' +
          '<a class="dl-link" href="' + (sec.pdfFile || '#') + '" download>⬇️ Pobierz PDF (' + (sec.pdfPages || 10) + ' stron)</a>' +
        '</div>' +
      '</div>';

    wrapper.innerHTML = teoriaHtml + quizHtml + tasksHtml + downloadHtml;
    sectionsEl.appendChild(wrapper);

    document.getElementById("audio-" + sec.id).addEventListener("click", function(){
      speak(sec.speech, this);
    });
    if (sec.borrowDemo) createStepper("stepper-" + sec.id, sec.borrowDemo);
    if (sec.commaDemo) createStepper("stepper-" + sec.id, sec.commaDemo);
    renderDownloadGate(sec);

    renderQuiz(sec);
    renderTasks(sec);
  }

  // ---------- QUIZ ----------
  function renderQuiz(sec){
    var body = document.getElementById("quiz-body-" + sec.id);
    var st = state[sec.id];

    if (st.quizDone) {
      body.innerHTML =
        '<div class="quiz-done show">' +
          '<div class="big">' + (st.quizCorrect === sec.quiz.length ? "🏆" : "✅") + '</div>' +
          '<p>Wynik: ' + st.quizCorrect + ' / ' + sec.quiz.length + ' poprawnych odpowiedzi.</p>' +
          '<button type="button" class="retry-btn" id="retry-' + sec.id + '">Spróbuj quizu jeszcze raz</button>' +
        '</div>';
      document.getElementById("retry-" + sec.id).addEventListener("click", function(){
        state[sec.id].quizIndex = 0;
        state[sec.id].quizCorrect = 0;
        state[sec.id].quizDone = false;
        saveProgress();
        renderQuiz(sec);
        renderTabs();
        renderOverallStars();
      });
      return;
    }

    var qi = st.quizIndex;
    var q = sec.quiz[qi];

    var html =
      '<div class="quiz-progress">Pytanie ' + (qi+1) + ' z ' + sec.quiz.length + '</div>' +
      '<div class="quiz-q">' + q.q + '</div>' +
      '<div class="quiz-options" id="opts-' + sec.id + '"></div>' +
      '<div class="feedback" id="fb-' + sec.id + '"></div>' +
      '<button type="button" class="back-link" id="backlink-' + sec.id + '" style="display:none;">⬆️ Wróć do teorii i przeczytaj jeszcze raz</button><br>' +
      '<button type="button" class="next-btn" id="next-' + sec.id + '">Następne pytanie →</button>';

    body.innerHTML = html;

    var optsEl = document.getElementById("opts-" + sec.id);
    q.options.forEach(function(opt, i){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = opt;
      b.addEventListener("click", function(){ handleQuizAnswer(sec, i); });
      optsEl.appendChild(b);
    });
  }

  function handleQuizAnswer(sec, chosenIndex){
    var qi = state[sec.id].quizIndex;
    var q = sec.quiz[qi];
    var optsEl = document.getElementById("opts-" + sec.id);
    var buttons = optsEl.querySelectorAll("button");
    buttons.forEach(function(b, i){
      b.disabled = true;
      if (i === q.correct) b.classList.add("correct");
      if (i === chosenIndex && chosenIndex !== q.correct) b.classList.add("wrong");
    });

    var fb = document.getElementById("fb-" + sec.id);
    var backlink = document.getElementById("backlink-" + sec.id);
    var nextBtn = document.getElementById("next-" + sec.id);

    if (chosenIndex === q.correct) {
      state[sec.id].quizCorrect++;
      fb.className = "feedback show ok";
      fb.innerHTML = "Brawo, dobrze! <span class='expl'>" + q.expl + "</span>";
      nextBtn.classList.add("show");
      nextBtn.textContent = (qi === sec.quiz.length - 1) ? "Zobacz wynik →" : "Następne pytanie →";
      nextBtn.onclick = function(){
        state[sec.id].quizIndex++;
        if (state[sec.id].quizIndex >= sec.quiz.length) state[sec.id].quizDone = true;
        saveProgress();
        renderQuiz(sec);
        renderTabs();
        renderOverallStars();
      };
    } else {
      fb.className = "feedback show bad";
      fb.innerHTML = "To jeszcze nie to. <span class='expl'>" + q.expl + "</span>";
      backlink.style.display = "inline-block";
      backlink.onclick = function(){
        var teoriaBox = document.getElementById("teoria-" + sec.id);
        teoriaBox.scrollIntoView({behavior:"smooth", block:"start"});
        teoriaBox.classList.add("pulse");
        setTimeout(function(){ teoriaBox.classList.remove("pulse"); }, 2300);
      };
      // pozwól spróbować ponownie to samo pytanie
      var retryQ = document.createElement("button");
      retryQ.type = "button";
      retryQ.className = "retry-btn";
      retryQ.style.marginLeft = "10px";
      retryQ.textContent = "Spróbuj tego pytania jeszcze raz";
      retryQ.addEventListener("click", function(){ renderQuiz(sec); });
      backlink.insertAdjacentElement("afterend", retryQ);
    }
    saveProgress();
  }

  // ---------- ZADANIA ----------
  function parseAnswer(str){
    if (typeof str !== "string") return NaN;
    var clean = str.trim().replace(",", ".").replace(/\s/g, "");
    if (clean === "") return NaN;
    return parseFloat(clean);
  }

  function renderTasks(sec){
    var body = document.getElementById("tasks-body-" + sec.id);
    body.innerHTML = "";
    sec.tasks.forEach(function(t, idx){
      var solved = !!state[sec.id].tasksSolved[idx];
      var taskDiv = document.createElement("div");
      taskDiv.className = "task" + (solved ? " solved" : "");
      taskDiv.innerHTML =
        '<div class="task-q">' + (idx+1) + '. ' + t.q + (solved ? " ✓" : "") + '</div>' +
        '<div class="task-row">' +
          '<input type="text" inputmode="decimal" placeholder="np. 3,75" id="input-' + sec.id + '-' + idx + '">' +
          '<button type="button" id="check-' + sec.id + '-' + idx + '">Sprawdź</button>' +
        '</div>' +
        '<div class="task-result" id="result-' + sec.id + '-' + idx + '"></div>';
      body.appendChild(taskDiv);

      var input = taskDiv.querySelector('#input-' + sec.id + '-' + idx);
      var checkBtn = taskDiv.querySelector('#check-' + sec.id + '-' + idx);
      var resultEl = taskDiv.querySelector('#result-' + sec.id + '-' + idx);

      if (solved) input.value = "";

      function doCheck(){
        var val = parseAnswer(input.value);
        if (isNaN(val)) {
          resultEl.className = "task-result show bad";
          resultEl.textContent = "Wpisz liczbę, np. 3,75 albo 3.75.";
          return;
        }
        if (Math.abs(val - t.a) < 0.005) {
          resultEl.className = "task-result show ok";
          resultEl.textContent = "Świetnie, to poprawna odpowiedź! 🎉";
          state[sec.id].tasksSolved[idx] = true;
          taskDiv.classList.add("solved");
          saveProgress();
          renderTabs();
          renderOverallStars();
        } else {
          resultEl.className = "task-result show bad";
          resultEl.innerHTML = "Jeszcze nie tak. Podpowiedź: " + t.hint +
            '<br><button type="button" class="back-link" id="backtask-' + sec.id + '-' + idx + '">⬆️ Wróć do teorii</button>';
          var backBtn = document.getElementById("backtask-" + sec.id + "-" + idx);
          backBtn.addEventListener("click", function(){
            var teoriaBox = document.getElementById("teoria-" + sec.id);
            teoriaBox.scrollIntoView({behavior:"smooth", block:"start"});
            teoriaBox.classList.add("pulse");
            setTimeout(function(){ teoriaBox.classList.remove("pulse"); }, 2300);
          });
        }
      }
      checkBtn.addEventListener("click", doCheck);
      input.addEventListener("keydown", function(e){ if (e.key === "Enter") doCheck(); });
    });
  }

  // ---------- RESET ----------
  document.getElementById("resetBtn").addEventListener("click", function(){
    if (!confirm("Na pewno wyczyścić wszystkie postępy Marysi?")) return;
    SECTIONS.forEach(function(s){
      state[s.id] = { quizIndex: 0, quizCorrect: 0, quizDone: false, tasksSolved: {} };
    });
    saveProgress();
    renderTabs();
    renderSections();
    renderOverallStars();
  });

  // wymuś załadowanie listy głosów (niektóre przeglądarki ładują asynchronicznie)
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = function(){};
    window.speechSynthesis.getVoices();
  }

  renderTabs();
  renderSections();
  renderOverallStars();
})();
</script>
